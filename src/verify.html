<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>postMessage Mapper — Verify</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    :root{--bg:#0f131a;--panel:#161c26;--panel2:#1c2531;--line:#273143;
      --ink:#cbd3df;--muted:#6f7c90;--accent:#4db8c4;
      --safe:#3fb27f;--warn:#e0a340;--danger:#e5484d;
      --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
      font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;padding:24px 32px}
    h1{font-size:18px;font-weight:600;margin:0 0 4px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:20px;font-family:var(--mono);word-break:break-all}
    .status-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
    .status-label{font-size:13px;color:var(--muted);margin-bottom:8px}
    .status-main{font-size:22px;font-weight:700;font-family:var(--mono)}
    .confirmed{color:var(--safe)} .failed{color:var(--danger)} .testing{color:var(--warn)}
    .progress{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--line);transition:.2s}
    .dot.tried{background:var(--muted)} .dot.hit{background:var(--safe)}
    .log{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:12px;
      font-family:var(--mono);font-size:12px;color:#8a99ad;max-height:280px;overflow-y:auto;margin-bottom:16px;white-space:pre-wrap}
    .log .ok{color:var(--safe)} .log .err{color:var(--danger)} .log .hl{color:var(--accent)}
    .actions{display:flex;gap:10px;margin-top:16px}
    button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
      padding:10px 18px;font-size:13px;cursor:pointer;font-family:var(--mono)}
    button:hover{border-color:var(--accent);color:#fff}
    button:disabled{opacity:.4;cursor:default}
    button.primary{background:#163a3e;border-color:var(--accent);color:var(--accent)}
    #target-area{margin-top:16px;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
    #target-area iframe{width:100%;height:350px;border:none;display:block}
    .target-label{position:absolute;top:8px;left:10px;font-size:10px;color:var(--muted);background:rgba(15,19,26,.85);padding:2px 8px;border-radius:4px;z-index:1}
    .result-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px}
    .result-box h2{margin:0 0 8px;font-size:15px}
    pre.poc{background:#0b0e13;border:1px solid var(--line);border-radius:6px;padding:12px;
      font-family:var(--mono);font-size:11px;color:#9fb0c4;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
    .hidden{display:none}
  </style>
</head>
<body>
  <h1><span style="color:var(--accent)">&#9679;</span> postMessage XSS Verification</h1>
  <div class="sub" id="targetUrl">—</div>

  <div class="status-box">
    <div class="status-label">STATUS</div>
    <div class="status-main testing" id="status">Initializing…</div>
    <div class="progress" id="dots"></div>
  </div>

  <div class="log" id="log"></div>

  <div id="target-area" class="hidden">
    <div class="target-label">target iframe</div>
  </div>

  <div id="result" class="result-box hidden">
    <h2 id="result-title"></h2>
    <div id="result-detail"></div>
    <pre class="poc hidden" id="poc-code"></pre>
    <div class="actions">
      <button id="btn-poc" class="primary hidden">Download PoC HTML</button>
      <button id="btn-close">Close this tab</button>
    </div>
  </div>

  <script src="verify.js"></script>
</body>
</html>
